# libs.versions.toml — Catálogo centralizado de versiones (Version Catalog)
# Esto evita duplicar versiones en múltiples archivos build.gradle.kts

[versions]
# Core Android y Kotlin
agp                     = "8.13.0"
kotlin                  = "2.0.0"
ksp                     = "2.0.0-1.0.21"
coreKtx                 = "1.13.1"

# Compose
composeBom              = "2024.09.00"
composeCompiler         = "1.5.15"  # Debe coincidir con la versión de Kotlin
activityCompose         = "1.9.2"

# Wear OS (Compose for Wear OS)
wearComposeMaterial     = "1.3.1"
wearComposeFoundation   = "1.3.1"
wearComposeNavigation   = "1.0.0-alpha23"
wearInput               = "1.2.0-alpha02"
playServicesWearable    = "18.2.0"
wearDataLayer           = "1.1.0"

# Ciclo de vida y arquitectura
lifecycle               = "2.8.6"
viewmodel               = "2.8.6"

# Corrutinas (asincronía)
coroutines              = "1.8.1"

# Inyección de dependencias
hilt                    = "2.52"
hiltNavigationCompose   = "1.2.0"

# Base de datos local
room                    = "2.6.1"

# Preferencias
datastorePreferences    = "1.1.1"

# Navegación
navigationCompose       = "2.8.1"

# WorkManager (para tareas en background)
workManager             = "2.9.1"
hiltWork                = "1.2.0"

# Splash Screen
splashScreen            = "1.0.1"

# Testing
junit                   = "4.13.2"
androidxTestExt         = "1.2.1"
espresso                = "3.6.1"

[libraries]
# ─── Core ──────────────────────────────────────────────────────
core-ktx                = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
splash-screen           = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashScreen" }

# ─── Compose (BOM sincroniza todas las versiones de Compose) ───
compose-bom             = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons  = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose        = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ─── Wear OS Compose ───────────────────────────────────────────
wear-compose-material   = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearComposeMaterial" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearComposeFoundation" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearComposeNavigation" }
wear-input              = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }
play-services-wearable  = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
wear-data-layer         = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearDataLayer" }

# ─── Lifecycle y ViewModel ─────────────────────────────────────
lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
viewmodel-compose       = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "viewmodel" }
viewmodel-ktx           = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "viewmodel" }

# ─── Corrutinas ────────────────────────────────────────────────
coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# ─── Hilt (Inyección de dependencias) ──────────────────────────
hilt-android            = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work               = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
hilt-work-compiler      = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

# ─── Room (Base de datos local) ────────────────────────────────
room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ─── DataStore (Preferencias modernas) ────────────────────────
datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# ─── Navegación ────────────────────────────────────────────────
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ─── WorkManager ───────────────────────────────────────────────
work-runtime-ktx        = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# ─── Testing ───────────────────────────────────────────────────
junit                   = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext       = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
espresso-core           = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application     = { id = "com.android.application", version.ref = "agp" }
android-library         = { id = "com.android.library", version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt             = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt-android            = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp", version.ref = "ksp" }
