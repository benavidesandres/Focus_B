# Project-level Gradle settings.
# For more details on how to configure your build environment visit
# https://developer.android.com/studio/build/build-properties

# Directorio de descargas y caché de Gradle en el disco D (255 GB libres)
gradle.user.home=D:/.gradle

# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# AndroidX support
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
